[project]
name = "ops-lab"
version = "1.0.0"
description = "Demonstracyjne narzędzia administracji serwerami: backup, monitoring i bezpieczne wdrożenia"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
backup-guard = "backup_guard.__main__:main"
service-watch = "service_watch.__main__:main"
release-guard = "release_guard.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

